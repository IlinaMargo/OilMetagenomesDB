name: Tests

# Run the validation-script tests when the scripts, schemas or tests change
on:
  pull_request:
    paths:
      - 'scripts/validation_*.py'
      - 'scripts/validate_local.py'
      - 'schemas_samples/**'
      - 'schemas_libraries/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/validation_*.py'
      - 'scripts/validate_local.py'
      - 'schemas_samples/**'
      - 'schemas_libraries/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests
